<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style/base.css">
    <link rel="stylesheet" href="./style/listings.css">
    <script src="./javascript/listings.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Optimizer - My Listings</title>
</head>
<body>
    <header>
        <div class="logo">
            <h2> Resume Optimizer </h2>
        </div>
        <nav>
            <ul>
                <li><a href="/">home</a></li> <!-- TODO: Add link -->
                <li><a href="#">Sign out</a></li> <!-- TODO: Add link -->
            </ul>
        </nav>
    </header>
    <div class="content">
        <h1>My Listings</h1>
        <div id="view_listings" class="listing_data">
            <div class="table">
                <div class="table_header">
                    <div id="add_button" class="header_button">Add + </div>
                    <div id="remove_button" class="header_button">Remove -</div>
                </div>
                <div id="table_entries" class="table_entries"></div>
            </div>
            <div id="side_view" class="side_view">
              <div class="listing_details_header">
                  <h2>Listing Details</h2>
                  <button id="close_side_view" class="close_side_view_btn">X</button>
              </div>
              <div class="listing_details">
                <div class="job_company">
                  <span class="title">Company:</span>
                  <div>Some company name</div>
                </div>

                <div class="job_position">
                  <span class="title">Position:</span>
                  <div>Some position name</div>
                </div>

                <!-- <div class="creation_details"> 
                  <span class="title">Created at:</span>
                  <div>timestamp</div>
                </div> -->

                <div class="url">
                  <span class="title">URL:</span>
                  <div>someLink</div>
                </div>
              </div>
            </div>
        </div>
    </div>
    </div>
    <footer>
        <h3><a href="https://github.com/LiangtaoHu/resume_RAG" target="_blank"> Git Repository </a> </h3> 
    </footer>
</body>
</html>
